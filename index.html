<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoiceMatch</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --card-back: #fbfbfd;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #9b9ba3;
      --hint: #7aa6d6;
      --hint-soft: #c5dcef;
      --border: rgba(15, 15, 30, 0.06);
      --pill-bg: #f3f3f6;
      --accent: #ff5e9e;
      --accent-soft: #ffe1ec;
      --shadow-card: 0 1px 2px rgba(20, 20, 40, 0.04), 0 12px 40px rgba(20, 20, 40, 0.06);
      --shadow-card-back: 0 8px 24px rgba(20, 20, 40, 0.04);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-stack, .result, .history { width: 100%; }

    /* ─── Title ─── */
    .title-row {
      text-align: center;
      margin-bottom: 28px;
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text);
    }

    /* ─── Layered card ─── */
    .card-stack {
      position: relative;
      margin: 0 auto;
    }
    .card-back {
      position: absolute;
      top: -14px; left: 18px; right: 18px;
      height: 100%;
      background: var(--card-back);
      border-radius: 28px;
      box-shadow: var(--shadow-card-back);
      z-index: 0;
    }
    .card-front {
      position: relative;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow-card);
      padding: 28px 24px 20px;
      z-index: 1;
      overflow: hidden;
    }

    /* ─── Orb ─── */
    .orb-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .orb {
      position: relative;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }
    .orb .blob {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      filter: blur(34px);
      mix-blend-mode: multiply;
      opacity: 0.9;
      transition: background 0.8s ease, opacity 0.6s ease;
      will-change: transform, opacity;
    }
    /* Default — soft pink */
    .orb .blob:nth-child(1) {
      background: radial-gradient(circle at 30% 32%, #ff8fbc 0%, rgba(255,143,188,0) 62%);
      animation: morph1 9s ease-in-out infinite;
    }
    .orb .blob:nth-child(2) {
      background: radial-gradient(circle at 70% 55%, #ff5e9e 0%, rgba(255,94,158,0) 60%);
      animation: morph2 11s ease-in-out infinite;
    }
    .orb .blob:nth-child(3) {
      background: radial-gradient(circle at 50% 75%, #ffc4dc 0%, rgba(255,196,220,0) 70%);
      animation: morph3 13s ease-in-out infinite;
    }

    @keyframes morph1 {
      0%, 100% { transform: scale(1) translate(0,0) rotate(0); }
      50%      { transform: scale(1.08) translate(-6px, 4px) rotate(40deg); }
    }
    @keyframes morph2 {
      0%, 100% { transform: scale(0.96) translate(0,0) rotate(0); }
      50%      { transform: scale(1.06) translate(8px, -4px) rotate(-30deg); }
    }
    @keyframes morph3 {
      0%, 100% { transform: scale(1.02) translate(0,0) rotate(0); }
      50%      { transform: scale(0.94) translate(-4px, -6px) rotate(20deg); }
    }

    /* Listening — more vibrant, faster */
    .orb-wrap.listening .orb .blob {
      animation-duration: 3.5s, 4s, 4.5s;
    }
    .orb-wrap.listening .orb .blob:nth-child(1) {
      background: radial-gradient(circle at 30% 32%, #ff4d8a 0%, rgba(255,77,138,0) 60%);
    }
    .orb-wrap.listening .orb .blob:nth-child(2) {
      background: radial-gradient(circle at 70% 55%, #ff2e7e 0%, rgba(255,46,126,0) 58%);
    }

    /* Processing — blue/violet shift */
    .orb-wrap.processing .orb .blob:nth-child(1) {
      background: radial-gradient(circle at 30% 32%, #b4a4ff 0%, rgba(180,164,255,0) 62%);
    }
    .orb-wrap.processing .orb .blob:nth-child(2) {
      background: radial-gradient(circle at 70% 55%, #8aa9ff 0%, rgba(138,169,255,0) 60%);
    }
    .orb-wrap.processing .orb .blob:nth-child(3) {
      background: radial-gradient(circle at 50% 75%, #d2c5ff 0%, rgba(210,197,255,0) 70%);
    }
    .orb-wrap.processing .orb .blob {
      animation-duration: 2.5s, 3s, 3.5s;
    }

    /* Playing — green-cyan happy */
    .orb-wrap.playing .orb .blob:nth-child(1) {
      background: radial-gradient(circle at 30% 32%, #7dd3c8 0%, rgba(125,211,200,0) 60%);
    }
    .orb-wrap.playing .orb .blob:nth-child(2) {
      background: radial-gradient(circle at 70% 55%, #5fb8e0 0%, rgba(95,184,224,0) 60%);
    }
    .orb-wrap.playing .orb .blob:nth-child(3) {
      background: radial-gradient(circle at 50% 75%, #b9e5dd 0%, rgba(185,229,221,0) 70%);
    }
    .orb-wrap.playing .orb .blob {
      animation-duration: 1.6s, 2s, 2.4s;
    }

    .orb-wrap:hover .orb { transform: scale(1.02); transition: transform 0.3s ease; }
    .orb-wrap:active .orb { transform: scale(0.98); }

    /* ─── Status under orb ─── */
    .status {
      text-align: center;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--hint);
      min-height: 26px;
      margin: 8px 0 14px;
      transition: color 0.3s;
    }
    .status.muted { color: var(--text-tertiary); font-weight: 400; }
    .status.listening { color: var(--accent); }
    .status.processing { color: #8a7dff; }

    /* ─── Transcript ─── */
    .transcript {
      text-align: center;
      font-size: 15px;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      line-height: 1.45;
      min-height: 22px;
      margin-bottom: 18px;
      padding: 0 8px;
      word-break: break-word;
    }
    .transcript:empty::before {
      content: '';
    }

    /* ─── Pill input ─── */
    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--pill-bg);
      border-radius: 100px;
      padding: 6px 6px 6px 6px;
    }
    .pill-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.18s, color 0.18s, transform 0.18s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .pill-btn:hover { color: var(--text); }
    .pill-btn:active { transform: scale(0.92); }
    .pill-btn svg { width: 16px; height: 16px; }

    .pill-btn.send {
      background: var(--accent);
      color: white;
    }
    .pill-btn.send:hover { background: #ff4d8a; }
    .pill-btn.send:disabled {
      background: #e5e5ea;
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    .pill-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--text);
      padding: 6px 4px;
    }
    .pill-input::placeholder { color: var(--text-tertiary); }

    /* ─── Result card ─── */
    .result {
      margin-top: 20px;
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
      padding: 22px 22px 20px;
      display: none;
    }
    .result.visible {
      display: block;
      animation: rise 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result { text-align: center; }
    .result-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .result-name {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .result-reason {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: -0.005em;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .result-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 100px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.005em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s, transform 0.18s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--text); color: var(--card); }
    .btn-primary:hover { background: #2c2c2e; }
    .btn-secondary { background: var(--accent-soft); color: var(--accent); }
    .btn-secondary:hover { background: #ffd0e1; }
    .btn svg { width: 12px; height: 12px; }

    /* ─── Audio bars ─── */
    .audio-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
    }
    .audio-bars span {
      display: block;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      height: 6px;
    }
    .audio-bars.playing span { animation: bounce 0.65s ease-in-out infinite; }
    .audio-bars span:nth-child(1) { animation-delay: 0s; }
    .audio-bars span:nth-child(2) { animation-delay: 0.1s; }
    .audio-bars span:nth-child(3) { animation-delay: 0.2s; }
    .audio-bars span:nth-child(4) { animation-delay: 0.05s; }
    @keyframes bounce {
      0%, 100% { height: 6px; }
      50% { height: 20px; }
    }

    /* ─── Loading dots ─── */
    .loading { display: inline-flex; gap: 5px; align-items: center; }
    .loading span {
      width: 6px; height: 6px;
      background: var(--text-tertiary);
      border-radius: 50%;
      animation: dot 1s ease-in-out infinite;
    }
    .loading span:nth-child(2) { animation-delay: 0.15s; }
    .loading span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dot {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    /* ─── Error ─── */
    .error {
      display: none;
      background: #fff2f4;
      color: #d83a52;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      margin: 16px 0 0;
      letter-spacing: -0.005em;
    }

    /* ─── History ─── */
    .history {
      margin-top: 22px;
      display: none;
    }
    .history.visible { display: block; }
    .history-label {
      font-size: 12px;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
      padding: 0 8px 10px;
      text-align: center;
    }
    .history-list {
      background: var(--card);
      border-radius: 18px;
      padding: 6px;
      box-shadow: var(--shadow-card-back);
      display: flex;
      flex-direction: column;
    }
    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: background 0.15s;
    }
    .history-item:hover { background: var(--bg); }
    .history-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffc4dc, #ff8fbc);
      flex-shrink: 0;
    }
    .history-text { flex: 1; min-width: 0; }
    .history-quote {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.005em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-sound {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 1px;
    }

    /* ─── Caption ─── */
    .caption {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: var(--text-tertiary);
      letter-spacing: -0.005em;
      line-height: 1.5;
    }
    .caption a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); }
    .caption a:hover { text-decoration-color: var(--text-tertiary); }

  </style>
</head>
<body>
  <main class="container">
    <div class="title-row">
      <div class="title">VoiceMatch</div>
    </div>

    <div class="card-stack">
      <div class="card-back" aria-hidden="true"></div>
      <div class="card-front">

        <!-- Orb (click to listen) -->
        <div class="orb-wrap" id="orbWrap" role="button" tabindex="0" aria-label="Tap to start listening">
          <div class="orb">
            <div class="blob"></div>
            <div class="blob"></div>
            <div class="blob"></div>
          </div>
        </div>

        <div class="status muted" id="status">Tap the orb to start listening</div>
        <div class="transcript" id="transcript"></div>

        <!-- Pill input -->
        <form class="pill" id="textForm" autocomplete="off">
          <button type="button" class="pill-btn" id="micPillBtn" aria-label="Toggle voice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="12" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0"/>
              <path d="M12 18v3"/>
            </svg>
          </button>
          <input
            type="text"
            class="pill-input"
            id="textInput"
            placeholder="Or type to share with AI…"
            maxlength="200"
            aria-label="Type a phrase"
          />
          <button type="submit" class="pill-btn send" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="M13 6l6 6-6 6"/>
            </svg>
          </button>
        </form>

        <div class="error" id="error"></div>

      </div>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-label">Matched sound</div>
      <h2 class="result-name" id="resultName"></h2>
      <p class="result-reason" id="resultReason"></p>
      <div class="result-actions">
        <button class="btn btn-primary" id="playBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          Play again
        </button>
        <a class="btn btn-secondary" id="sourceBtn" href="#" target="_blank" rel="noopener">View source</a>
      </div>
    </div>

    <!-- History -->
    <div class="history" id="historyCard">
      <div class="history-label">Recent</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <p class="caption">
      Speak or type — the orb finds the perfect sound.<br>
      Sounds via <a href="https://soundbuttonsworld.com" target="_blank" rel="noopener">soundbuttonsworld.com</a>
    </p>
  </main>

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // Release the tracks immediately — we only needed the permission.
          stream.getTracks().forEach(t => t.stop());
          return true;
        } catch (e) {
          micGrantedPromise = null; // allow retry on next click
          throw e;
        }
      })();
      return micGrantedPromise;
    }

    async function startListening() {
      hideError();

      try {
        await ensureMicPermission();
      } catch (e) {
        showError("Microphone access denied. Allow it in your browser settings.");
        return;
      }

      isListening = true;
      try { recognition.start(); }
      catch(e) { recognition = null; if (initRecognition()) recognition.start(); }
      setOrbState('listening');
      setStatus('Listening — tap orb to stop', 'listening');
      setTranscript('');
    }
    function stopListening() {
      isListening = false;
      cancelPendingMatch();
      try { recognition && recognition.stop(); } catch(e) {}
      // Don't clear orb if processing/playing took over
      if ($("orbWrap").classList.contains('listening')) setOrbState('');
      if ($("status").classList.contains('listening')) setStatus('Tap the orb to start listening', 'muted');
    }

    // ─── UI helpers ───────────────────────────────────────────────────────────
    function setOrbState(state) {
      const el = $("orbWrap");
      el.classList.remove('listening', 'processing', 'playing');
      if (state) el.classList.add(state);
    }
    function setStatus(text, cls = 'muted') {
      const el = $("status");
      el.textContent = text;
      el.className = 'status ' + cls;
    }
    function setTranscript(text) {
      $("transcript").textContent = text || '';
    }
    function showError(msg) {
      const el = $("error");
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { $("error").style.display = 'none'; }

    // ─── Matching ─────────────────────────────────────────────────────────────
    async function findMatch(transcript) {
      setOrbState('processing');
      setStatus('Thinking…', 'processing');
      $("result").classList.add('visible');
      $("resultName").innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
      $("resultReason").textContent = '';
      $("playBtn").style.display = 'none';
      $("sourceBtn").style.display = 'none';

      // Hard-wired laugh shortcut: skip AI entirely when laughter is present.
      if (isLaughing(transcript)) {
        const i = idxOf("goofy-ahh-laugh-1668034461376");
        if (i >= 0) {
          showResult(SOUNDS[i], "Heard you laughing — laugh track engaged.", transcript);
          return;
        }
      }

      const list = SOUNDS.map(s => `- slug: "${s.slug}" | name: "${s.name}" | trigger: ${s.trigger}`).join('\n');
      let matched = null;
      let reason = '';

      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 500,
            system: `You are a witty meme sound effect DJ. Classify what the user said into ONE of the trigger conditions below, then fire that sound.

When two triggers could apply, follow this priority:
Vine Boom > Bruh > Are You Serious Right Now > Wet Fart Meme > Goofy Ahh Sounds > everything else.
When in doubt, prefer the funnier or more unexpected pick.

Respond with ONLY valid JSON, no markdown:
{"soundSlug": "exact-slug-from-list", "reason": "punchy reason under 18 words"}`,
            messages: [{ role: "user", content: `User said: "${transcript}"\n\nAvailable sounds:\n${list}` }]
          })
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        let raw = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('').replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(raw);
        matched = SOUNDS.find(s => s.slug === parsed.soundSlug);
        reason = parsed.reason || '';
      } catch (e) {
        ({ matched, reason } = keywordMatch(transcript));
      }

      if (!matched) matched = SOUNDS[Math.floor(Math.random() * SOUNDS.length)];
      showResult(matched, reason || trollFallback(transcript, matched), transcript);
    }

    // Witty 1-sentence trolling reasons used only when nothing actually matched.
    function trollFallback(text, sound) {
      const snippet = text.length > 30 ? text.slice(0, 30) + '…' : text;
      const trolls = [
        `Your words had zero useful keywords, so I ran them through the vibes oracle and out came "${sound.name}."`,
        `Couldn't parse a single coherent thought, but your aura screams "${sound.name}" — don't @ me.`,
        `Nothing you said matched anything in the library, so this is the AI's most honest read of your energy.`,
        `Honestly, "${snippet}" was unhinged enough that "${sound.name}" felt like the only emotionally accurate response.`,
        `Ran your input through three vibe filters and the matcher shrugged — take "${sound.name}" as a personality assessment.`,
        `If your words made sense I'd have picked something else; they didn't, and "${sound.name}" judging you fixes that.`,
        `My keyword matcher quit halfway through reading that, so "${sound.name}" is here to fill the void.`,
        `Couldn't tell if that was a sentence or a cry for help, but "${sound.name}" is the diagnosis either way.`,
      ];
      return trolls[Math.floor(Math.random() * trolls.length)];
    }

    // Index sounds by slug for readable rule lookups
    const idxOf = (slug) => SOUNDS.findIndex(s => s.slug === slug);

    // Detect actual laughter — runs before everything else.
    // Matches: haha, hehe, hahaha, ha ha, he he he, lol, lmao, lmfao, rofl,
    //          giggle, chuckle, cracking up, dying laughing, etc.
    const LAUGH_RE = /(?:\bha+\s*){2,}|(?:\bhe+\s*){2,}|\b(lol+|lmao+|lmfao+|rofl|lulz?)\b|\b(giggl|chuckl|laugh)\w*|\bcracking up\b|\bdying( laughing)?\b/i;

    function isLaughing(text) {
      return LAUGH_RE.test(text);
    }

    // Score a single sound against the user's text.
    //   sound-name mention   = 12 pts (e.g. user literally says "rizz")
    //   phrase match         =  5 pts each
    //   keyword (whole word) =  1 pt each
    function scoreSound(text, sound) {
      const padded = ' ' + text.toLowerCase().replace(/[^\w\s'-]/g, ' ').replace(/\s+/g, ' ') + ' ';
      let score = 0;

      const nameLower = ' ' + sound.name.toLowerCase() + ' ';
      if (padded.includes(nameLower)) score += 12;

      for (const phrase of (sound.phrases || [])) {
        if (padded.includes(' ' + phrase + ' ') ||
            padded.includes(' ' + phrase) ||
            padded.includes(phrase + ' ')) {
          score += 5;
        }
      }

      const escape = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      for (const kw of (sound.keywords || [])) {
        // Trailing "*" means stem match — e.g. "crash*" hits crash, crashed, crashing.
        if (kw.endsWith('*')) {
          const stem = kw.slice(0, -1);
          if (new RegExp('\\b' + escape(stem) + '\\w*', 'i').test(text)) score += 1;
        } else {
          if (new RegExp('\\b' + escape(kw) + '\\b', 'i').test(text)) score += 1;
        }
      }

      // Favorite boost — only counts when the sound has at least one organic
      // hit, so favorites win narrow ties without overriding stronger matches
      // and without firing when no signal exists at all.
      if (score > 0 && sound.boost) score += sound.boost;

      return score;
    }

    // Pick the highest-scoring sound. Ties are broken by SOUNDS array order,
    // which matches the sounds.md priority list.
    function bestKeywordMatch(text) {
      let bestIdx = -1, bestScore = 0;
      SOUNDS.forEach((s, i) => {
        const sc = scoreSound(text, s);
        if (sc > bestScore) { bestScore = sc; bestIdx = i; }
      });
      return bestIdx >= 0 ? SOUNDS[bestIdx] : null;
    }

    function keywordMatch(text) {
      // Tier 0: explicit laugh detection — always wins.
      if (isLaughing(text)) {
        const i = idxOf("goofy-ahh-laugh-1668034461376");
        if (i >= 0) return { matched: SOUNDS[i], reason: "Heard you laughing — laugh track engaged." };
      }

      // Tier 1: keyword/phrase scoring across every sound.
      const best = bestKeywordMatch(text);
      if (best) return { matched: best, reason: best.reason };

      // Tier 2: sentiment-based fallback — much better than pure random.
      const sentiment = sentimentMatch(text);
      if (sentiment) return sentiment;

      // Nothing scored — caller falls back to random.
      return { matched: null, reason: '' };
    }

    // Lightweight sentiment routing for inputs that miss every keyword.
    // Picks a sound that matches the emotional tone instead of going random.
    function sentimentMatch(text) {
      const t = ' ' + text.toLowerCase() + ' ';
      const has = (re) => re.test(t);

      const buckets = [
        // [test, sound slug, reason]
        [/\b(happy|excited|stoked|thrilled|pumped|hyped|love|loved|loving|great|good|nice|wonderful|yay|yes+|woohoo|let'?s? go)\b/,
         "ahhhhh-1663858639507", "Felt the joy in your message — hype response engaged."],
        [/\b(sad|cry|crying|cried|tear|tears|depress\w*|miserable|lonely|alone|hurt|hurts|miss|missed|missing|broken|heartbroken)\b/,
         "sad-violin-1642637531345", "Feels detected — cueing the violins."],
        [/\b(angry|mad|furious|pissed|rage|raging|hate|hated|annoyed|frustrat\w*)\b/,
         "get-out-tuco-1713706345464", "Big mad energy — kicking it out, Tuco-style."],
        [/\b(what|why|how|huh|confus\w*|wait|weird|strange|wtf)\b/,
         "wait-what-1669059468952", "Couldn't tell what you meant — neither could I."],
        [/\b(hungry|starving|food|eat|ate|eating|snack|meal|breakfast|lunch|dinner)\b/,
         "minecraft-eating-1671129126604", "Heard food — *munch munch*."],
        [/\b(buy|bought|paid|pay|spend|spent|expensive|cheap|broke|cash|money|dollar|price|cost)\b/,
         "apple-pay-1747322427448", "Money words detected — Apple Pay says yes."],
        [/\b(error|bug|broke|broken|crash\w*|glitch\w*|fail\w*|stopped working|not working)\b/,
         "error-1669062015100", "Sounds like something broke."],
        [/\b(scared|afraid|terrif\w*|creep\w*|spook\w*|haunt\w*|ghost|nightmare)\b/,
         "fnaf-music-box-1-minute-1684885636708", "Spooky vibes — something is watching."],
        [/\b(boring|bored|meh|whatever|fine|tired|exhaust\w*)\b/,
         "we-do-not-care-1670161970808", "Felt that flat energy — we do not care."],
      ];

      for (const [re, slug, reason] of buckets) {
        if (has(re)) {
          const i = idxOf(slug);
          if (i >= 0) return { matched: SOUNDS[i], reason };
        }
      }
      return null;
    }

    // ─── Show & play result ───────────────────────────────────────────────────
    function showResult(sound, reason, transcript) {
      const bars = '<span class="audio-bars" id="audioBars"><span></span><span></span><span></span><span></span></span>';
      $("resultName").innerHTML = bars + ' <span>' + escapeHTML(sound.name) + '</span>';
      $("resultReason").textContent = reason;
      $("playBtn").style.display = 'inline-flex';
      $("sourceBtn").style.display = 'inline-flex';
      $("sourceBtn").href = PAGE_BASE + sound.slug;
      $("playBtn").onclick = () => playSound(sound);

      playSound(sound);
      addHistory(transcript, sound, reason);
    }

    const MAX_PLAY_MS = 4000;
    let playTimer = null;

    function playSound(sound) {
      if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
      if (playTimer) { clearTimeout(playTimer); playTimer = null; }

      const audio = new Audio(SOUND_BASE + sound.file);
      audio.preload = 'auto';
      currentAudio = audio;

      const bars = $("audioBars");
      if (bars) bars.classList.add('playing');
      setOrbState('playing');
      setStatus('Now playing…', 'muted');

      const onDone = () => {
        if (bars) bars.classList.remove('playing');
        if (playTimer) { clearTimeout(playTimer); playTimer = null; }
        // If we're still in continuous-listening mode, return the orb to its
        // listening look instead of going idle.
        if (isListening) {
          setOrbState('listening');
          setStatus('Listening — tap orb to stop', 'listening');
        } else {
          setOrbState('');
          setStatus('Tap the orb to start listening', 'muted');
        }
      };
      audio.addEventListener('ended', onDone);
      audio.addEventListener('error', () => { onDone(); showError("Couldn't load that sound."); });

      audio.play().then(() => {
        // Hard cap at MAX_PLAY_MS (4s).
        playTimer = setTimeout(() => {
          try { audio.pause(); audio.currentTime = 0; } catch(e){}
          onDone();
        }, MAX_PLAY_MS);
      }).catch(err => {
        onDone();
        console.warn('Autoplay blocked:', err);
      });
    }

    // ─── History ──────────────────────────────────────────────────────────────
    function addHistory(transcript, sound, reason) {
      history.unshift({ transcript, sound, reason });
      if (history.length > 6) history.pop();
      renderHistory();
    }
    function renderHistory() {
      const card = $("historyCard");
      if (!history.length) { card.classList.remove('visible'); return; }
      card.classList.add('visible');
      $("historyList").innerHTML = history.map((item, i) => `
        <button class="history-item" data-i="${i}">
          <span class="history-icon"></span>
          <span class="history-text">
            <span class="history-quote">${escapeHTML(item.transcript)}</span>
            <span class="history-sound">${escapeHTML(item.sound.name)}</span>
          </span>
        </button>`).join('');
      $("historyList").querySelectorAll('.history-item').forEach(el => {
        el.addEventListener('click', () => {
          const item = history[+el.dataset.i];
          if (!item) return;
          setTranscript(item.transcript);
          showResult(item.sound, item.reason, item.transcript);
        });
      });
    }
    function escapeHTML(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ─── Text input ───────────────────────────────────────────────────────────
    $("textForm").addEventListener('submit', (e) => {
      e.preventDefault();
      const text = $("textInput").value.trim();
      if (!text) return;
      if (isListening) stopListening();
      hideError();
      setTranscript(text);
      $("textInput").value = '';
      findMatch(text);
    });

    // ─── Init ─────────────────────────────────────────────────────────────────
    initRecognition();
  </script>
</body>
</html>
